<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/register.css">
    <script src="../js/preferences.js"></script>
</head>

<body>

    <div class="register-card">
        <div class="card-header">
            <h1 data-i18n="signup_title">Create your account</h1>
        </div>

        <div class="card-body">
            <div id="message" class="hidden"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username" data-i18n="signup_label_username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="signup_label_email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="signup_label_password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" data-i18n="signup_label_confirm_password">Enter your password
                        again</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn-signup" data-i18n="signup_button">Sign up</button>
            </form>

        </div>
    </div>

    <script type="module" src="/controllers/SignUpController.js"></script>

</body>

</html>
