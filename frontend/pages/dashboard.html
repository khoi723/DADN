<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAIWS – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 30px;
    }
    
    .dash-card {
      background: #fff;
      border-radius: 18px;
      border: 2px solid var(--card-border);
      padding: 24px 28px;
      box-shadow: var(--shadow);
    }
    
    .dash-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 20px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .stat-item {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    
    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
    }
    
    .chart-container {
      position: relative;
    }
    
    .card-moisture { grid-column: 1; grid-row: 1; }
    .card-temp { grid-column: 2; grid-row: 1; }
    .card-humidity { grid-column: 3; grid-row: 1; }
    .card-water { grid-column: 1 / -1; grid-row: 2; }
    
    .water-container {
      position: relative;
      height: 280px;
      width: 100%;
    }
    
    @media (max-width: 1200px) {
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .card-moisture { grid-column: 1; grid-row: 1; }
      .card-temp { grid-column: 2; grid-row: 1; }
      .card-humidity { grid-column: 1; grid-row: 2; }
      .card-water { grid-column: 1 / -1; grid-row: 3; }
    }
    
    @media (max-width: 768px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .card-moisture { grid-column: 1; grid-row: 1; }
      .card-temp { grid-column: 1; grid-row: 2; }
      .card-humidity { grid-column: 1; grid-row: 3; }
      .card-water { grid-column: 1; grid-row: 4; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="navbar-brand">SAIWS</span>
  <div class="navbar-icons">
    <button title="Notifications">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </svg>
    </button>
    <div class="profile-wrap">
      <button id="profileBtn" title="Profile">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </button>
      <div id="profileDropdown" class="profile-dropdown">
        <a href="#">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
          View Profile
        </a>
        <a href="settings.html">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.02 7.02 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-4a.484.484 0 0 0-.48.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.47.47 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.36 1.04.67 1.62.94l.36 2.54c.05.24.27.41.48.41h4c.24 0 .44-.17.48-.41l.36-2.54a7.4 7.4 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
          Settings
        </a>
        <div class="divider"></div>
        <a href="../login.html">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          Log out
        </a>
      </div>
    </div>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <a href="../index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="history.html">History</a>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Dashboard</h1>
    </div>

    <div class="dashboard-grid">

      <!-- Moisture Stats -->
      <div class="dash-card card-moisture">
        <div class="dash-card-title">Soil Moisture</div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">Current</div>
            <div class="stat-value" id="moistureCurrent">--%</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Average</div>
            <div class="stat-value" id="moistureAvg">--%</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Max</div>
            <div class="stat-value" id="moistureMax">--%</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Min</div>
            <div class="stat-value" id="moistureMin">--%</div>
          </div>
        </div>
        <div class="chart-container" style="position: relative; height: 200px; margin-top: 20px;">
          <canvas id="chartMoisture"></canvas>
        </div>
      </div>

      <!-- Temperature Stats -->
      <div class="dash-card card-temp">
        <div class="dash-card-title">Temperature</div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">Current</div>
            <div class="stat-value" id="tempCurrent">--°C</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Average</div>
            <div class="stat-value" id="tempAvg">--°C</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Max</div>
            <div class="stat-value" id="tempMax">--°C</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Min</div>
            <div class="stat-value" id="tempMin">--°C</div>
          </div>
        </div>
        <div class="chart-container" style="position: relative; height: 200px; margin-top: 20px;">
          <canvas id="chartTemp"></canvas>
        </div>
      </div>

      <!-- Humidity Stats (if available) -->
      <div class="dash-card card-humidity">
        <div class="dash-card-title">Air Humidity</div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">Current</div>
            <div class="stat-value" id="humidityCurrent">--%</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Average</div>
            <div class="stat-value" id="humidityAvg">--%</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Max</div>
            <div class="stat-value" id="humidityMax">--%</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Min</div>
            <div class="stat-value" id="humidityMin">--%</div>
          </div>
        </div>
        <div class="chart-container" style="position: relative; height: 200px; margin-top: 20px;">
          <canvas id="chartHumidity"></canvas>
        </div>
      </div>

      <!-- Water Usage Chart -->
      <div class="dash-card card-water">
        <div class="dash-card-title">Water Usage</div>
        <div class="water-container">
          <canvas id="chartWater"></canvas>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="../js/main.js"></script>
<script>
  const charts = {};
  let historicalData = []; // Cache dữ liệu lịch sử
  const MAX_DATA_POINTS = 24; // Keep only last 24 points

  // Format time
  function formatTime(date) {
    return date.getHours().toString().padStart(2, '0') + ':' + 
           date.getMinutes().toString().padStart(2, '0');
  }

  // Calculate statistics
  function calculateStats(data) {
    if (!data || data.length === 0) return { min: 0, max: 0, avg: 0, current: 0 };
    const sorted = [...data].sort((a, b) => a - b);
    const sum = data.reduce((a, b) => a + b, 0);
    return {
      min: Math.round(sorted[0] * 10) / 10,
      max: Math.round(sorted[sorted.length - 1] * 10) / 10,
      avg: Math.round((sum / data.length) * 10) / 10,
      current: Math.round(data[data.length - 1] * 10) / 10
    };
  }

  // Update stat values WITHOUT rebuilding charts - very fast
  function updateStatsUI(history) {
    const moistures = history.map(h => h.soil_moisture).filter(m => m !== null);
    const temps = history.map(h => h.temperature).filter(t => t !== null);
    const humidities = history.map(h => h.humidity).filter(h => h !== null);

    if (moistures.length > 0) {
      const moistureStats = calculateStats(moistures);
      document.getElementById('moistureCurrent').textContent = moistureStats.current + '%';
      document.getElementById('moistureAvg').textContent = moistureStats.avg + '%';
      document.getElementById('moistureMax').textContent = moistureStats.max + '%';
      document.getElementById('moistureMin').textContent = moistureStats.min + '%';
    }

    if (temps.length > 0) {
      const tempStats = calculateStats(temps);
      document.getElementById('tempCurrent').textContent = tempStats.current + '°C';
      document.getElementById('tempAvg').textContent = tempStats.avg + '°C';
      document.getElementById('tempMax').textContent = tempStats.max + '°C';
      document.getElementById('tempMin').textContent = tempStats.min + '°C';
    }

    if (humidities.length > 0) {
      const humidityStats = calculateStats(humidities);
      document.getElementById('humidityCurrent').textContent = humidityStats.current + '%';
      document.getElementById('humidityAvg').textContent = humidityStats.avg + '%';
      document.getElementById('humidityMax').textContent = humidityStats.max + '%';
      document.getElementById('humidityMin').textContent = humidityStats.min + '%';
    }
  }

  // Update chart data dynamically WITH smooth animations
  function updateChartsData() {
    
    const moistures = historicalData.map(h => h.soil_moisture).filter(m => m !== null);
    const temps = historicalData.map(h => h.temperature).filter(t => t !== null);
    const humidities = historicalData.map(h => h.humidity).filter(h => h !== null);

    const timeLabels = historicalData.map(h => {
      const date = new Date(h.recorded_at);
      return formatTime(date);
    });

    // Update Moisture chart data with smooth animation
    if (charts.chartMoisture) {
      charts.chartMoisture.data.labels = timeLabels;
      charts.chartMoisture.data.datasets[0].data = moistures;
      charts.chartMoisture.update('active'); // Smooth animation (300ms default)
    }

    // Update Temperature chart data with smooth animation
    if (charts.chartTemp) {
      charts.chartTemp.data.labels = timeLabels;
      charts.chartTemp.data.datasets[0].data = temps;
      charts.chartTemp.update('active');
    }

    // Update Humidity chart data with smooth animation
    if (charts.chartHumidity && humidities.length > 0) {
      charts.chartHumidity.data.labels = timeLabels;
      charts.chartHumidity.data.datasets[0].data = humidities;
      charts.chartHumidity.update('active');
    }

    // Update Water Usage chart with smooth animation
    if (charts.chartWater) {
      const dateLabels = [];
      const waterByDate = {};
      historicalData.forEach(h => {
        const date = new Date(h.recorded_at);
        const dateStr = (date.getDate()).toString().padStart(2, '0') + '-' + 
                        ((date.getMonth() + 1)).toString().padStart(2, '0');
        if (!dateLabels.includes(dateStr)) dateLabels.push(dateStr);
        if (!waterByDate[dateStr]) waterByDate[dateStr] = [];
        waterByDate[dateStr].push(h.soil_moisture);
      });

      const waterData = dateLabels.map(label => {
        const values = waterByDate[label];
        return Math.round(values.reduce((a, b) => a + b, 0) / values.length);
      });

      charts.chartWater.data.labels = dateLabels;
      charts.chartWater.data.datasets[0].data = waterData.map(v => Math.round(v * 2.5));
      charts.chartWater.update('active');
    }
  }

  // Build all charts once (only called on initial load)
  function buildCharts() {
    
    const moistures = historicalData.map(h => h.soil_moisture).filter(m => m !== null);
    const temps = historicalData.map(h => h.temperature).filter(t => t !== null);
    const humidities = historicalData.map(h => h.humidity).filter(h => h !== null);

    const timeLabels = historicalData.map(h => {
      const date = new Date(h.recorded_at);
      return formatTime(date);
    });

    // Build Moisture chart
    if (!charts.chartMoisture) {
      charts.chartMoisture = new Chart(document.getElementById('chartMoisture'), {
        type: 'line',
        data: {
          labels: timeLabels,
          datasets: [{
            label: 'Soil Moisture (%)',
            data: moistures,
            borderColor: '#3a9e3b',
            backgroundColor: 'rgba(58, 158, 59, 0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#3a9e3b',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 400,
            easing: 'easeInOutQuart'
          },
          plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
          scales: {
            y: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 11 }, color: '#888' }, grid: { color: '#eee' } },
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#888' } }
          }
        }
      });
    }

    // Build Temperature chart
    if (!charts.chartTemp) {
      charts.chartTemp = new Chart(document.getElementById('chartTemp'), {
        type: 'line',
        data: {
          labels: timeLabels,
          datasets: [{
            label: 'Temperature (°C)',
            data: temps,
            borderColor: '#e05555',
            backgroundColor: 'rgba(224, 85, 85, 0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#e05555',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 400,
            easing: 'easeInOutQuart'
          },
          plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
          scales: {
            y: { ticks: { stepSize: 5, font: { size: 11 }, color: '#888' }, grid: { color: '#eee' } },
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#888' } }
          }
        }
      });
    }

    // Build Humidity chart
    if (humidities.length > 0 && !charts.chartHumidity) {
      charts.chartHumidity = new Chart(document.getElementById('chartHumidity'), {
        type: 'line',
        data: {
          labels: timeLabels,
          datasets: [{
            label: 'Air Humidity (%)',
            data: humidities,
            borderColor: '#7c6fc4',
            backgroundColor: 'rgba(124, 111, 196, 0.08)',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#7c6fc4',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 400,
            easing: 'easeInOutQuart'
          },
          plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
          scales: {
            y: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 11 }, color: '#888' }, grid: { color: '#eee' } },
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#888' } }
          }
        }
      });
    }

    // Build Water Usage chart
    const dateLabels = [];
    const waterByDate = {};
    historicalData.forEach(h => {
      const date = new Date(h.recorded_at);
      const dateStr = (date.getDate()).toString().padStart(2, '0') + '-' + 
                      ((date.getMonth() + 1)).toString().padStart(2, '0');
      if (!dateLabels.includes(dateStr)) dateLabels.push(dateStr);
      if (!waterByDate[dateStr]) waterByDate[dateStr] = [];
      waterByDate[dateStr].push(h.soil_moisture);
    });

    const waterData = dateLabels.map(label => {
      const values = waterByDate[label];
      return Math.round(values.reduce((a, b) => a + b, 0) / values.length);
    });

    if (!charts.chartWater) {
      charts.chartWater = new Chart(document.getElementById('chartWater'), {
        type: 'bar',
        data: {
          labels: dateLabels,
          datasets: [{
            label: 'Water Flow (L)',
            data: waterData.map(v => Math.round(v * 2.5)),
            backgroundColor: '#8b83d4',
            borderRadius: 6,
            borderSkipped: false,
            barPercentage: 0.65
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 500,
            easing: 'easeInOutQuart'
          },
          plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
          scales: {
            y: { ticks: { stepSize: 50, font: { size: 11 }, color: '#888' }, grid: { color: '#eee' } },
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#888' } }
          }
        }
      });
    }
  }

  // Load initial data
  async function loadInitialData() {
    try {
      const historyRes = await fetch('/api/sensor/history?limit=24');
      const historyData = await historyRes.json();
      
      if (historyData.ok && historyData.history) {
        historicalData = historyData.history;
        updateStatsUI(historicalData);
        buildCharts();
      }
    } catch (error) {
    }
  }

  // Connect to real-time stream
  function connectStream() {
    const eventSource = new EventSource('/api/sensor/stream');

    eventSource.onmessage = (event) => {
      try {
        const message = JSON.parse(event.data);
        
        if (message.type === 'batch' && message.records) {
          // Append new records to historical data
          historicalData.push(...message.records);
          
          // Keep only last MAX_DATA_POINTS records
          if (historicalData.length > MAX_DATA_POINTS) {
            historicalData = historicalData.slice(historicalData.length - MAX_DATA_POINTS);
          }
          
          // Update ONLY stats values (instant, no animation)
          updateStatsUI(historicalData);
          
          // Update charts data dynamically (no rebuild, no animation)
          updateChartsData();
          
        } else if (message.type === 'connected') {
        }
      } catch (err) {
      }
    };

    eventSource.onerror = (error) => {
      eventSource.close();
      setTimeout(connectStream, 5000);
    };
  }

  // Load data when page loads
  document.addEventListener('DOMContentLoaded', () => {
    
    // Initial load
    loadInitialData();
    
    // Connect to real-time stream
    connectStream();
    
    // Full refresh every 5 minutes as safety net
    setInterval(() => {
      loadInitialData();
    }, 300000);
  });
</script>
</body>
</html>
