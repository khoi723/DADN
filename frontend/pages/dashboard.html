<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIWS – Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/preferences.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 30px;
    }

    .dash-card {
      background: var(--surface);
      border-radius: 18px;
      border: 2px solid var(--card-border);
      padding: 24px 28px;
      box-shadow: var(--shadow);
    }

    .dash-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-item {
      background: var(--surface-soft);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .chart-container {
      position: relative;
    }

    .card-moisture {
      grid-column: 1;
      grid-row: 1;
    }

    .card-temp {
      grid-column: 2;
      grid-row: 1;
    }

    .card-humidity {
      grid-column: 3;
      grid-row: 1;
    }

    .card-water {
      grid-column: 1 / -1;
      grid-row: 2;
    }

    .water-container {
      position: relative;
      height: 280px;
      width: 100%;
    }

    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .card-moisture {
        grid-column: 1;
        grid-row: 1;
      }

      .card-temp {
        grid-column: 2;
        grid-row: 1;
      }

      .card-humidity {
        grid-column: 1;
        grid-row: 2;
      }

      .card-water {
        grid-column: 1 / -1;
        grid-row: 3;
      }
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .card-moisture {
        grid-column: 1;
        grid-row: 1;
      }

      .card-temp {
        grid-column: 1;
        grid-row: 2;
      }

      .card-humidity {
        grid-column: 1;
        grid-row: 3;
      }

      .card-water {
        grid-column: 1;
        grid-row: 4;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <span class="navbar-brand">SAIWS</span>
    <div class="navbar-icons">
      <div class="profile-wrap">
        <button id="profileBtn" title="Profile" data-i18n-title="user_menu_title">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
          </svg>
        </button>
        <div id="profileDropdown" class="profile-dropdown">
          <a href="profile.html">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
            </svg>
            <span data-i18n="nav_view_profile">View Profile</span>
          </a>
          <div class="divider"></div>
          <a href="/views/login.html" data-logout>
            <svg viewBox="0 0 24 24">
              <path
                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
            </svg>
            <span data-i18n="nav_logout">Log out</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <a href="../index.html" data-i18n="nav_home">Home</a>
      <a href="dashboard.html" class="active" data-i18n="nav_dashboard">Dashboard</a>
      <a href="history.html" data-i18n="nav_history">History</a>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1 class="page-title" data-i18n="dashboard_title">Dashboard</h1>
      </div>

      <div class="dashboard-grid">

        <!-- Moisture Stats -->
        <div class="dash-card card-moisture">
          <div class="dash-card-title" data-i18n="dashboard_soil_moisture">Soil Moisture</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_current">Current</div>
              <div class="stat-value" id="moistureCurrent">--%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_average">Average</div>
              <div class="stat-value" id="moistureAvg">--%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_max">Max</div>
              <div class="stat-value" id="moistureMax">--%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_min">Min</div>
              <div class="stat-value" id="moistureMin">--%</div>
            </div>
          </div>
          <div class="chart-container" style="position: relative; height: 200px; margin-top: 20px;">
            <canvas id="chartMoisture"></canvas>
          </div>
        </div>

        <!-- Temperature Stats -->
        <div class="dash-card card-temp">
          <div class="dash-card-title" data-i18n="dashboard_temperature">Temperature</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_current">Current</div>
              <div class="stat-value" id="tempCurrent">--°C</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_average">Average</div>
              <div class="stat-value" id="tempAvg">--°C</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_max">Max</div>
              <div class="stat-value" id="tempMax">--°C</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_min">Min</div>
              <div class="stat-value" id="tempMin">--°C</div>
            </div>
          </div>
          <div class="chart-container" style="position: relative; height: 200px; margin-top: 20px;">
            <canvas id="chartTemp"></canvas>
          </div>
        </div>

        <!-- Humidity Stats (if available) -->
        <div class="dash-card card-humidity">
          <div class="dash-card-title" data-i18n="dashboard_air_humidity">Air Humidity</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_current">Current</div>
              <div class="stat-value" id="humidityCurrent">--%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_average">Average</div>
              <div class="stat-value" id="humidityAvg">--%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_max">Max</div>
              <div class="stat-value" id="humidityMax">--%</div>
            </div>
            <div class="stat-item">
              <div class="stat-label" data-i18n="stat_min">Min</div>
              <div class="stat-value" id="humidityMin">--%</div>
            </div>
          </div>
          <div class="chart-container" style="position: relative; height: 200px; margin-top: 20px;">
            <canvas id="chartHumidity"></canvas>
          </div>
        </div>

        <!-- Water Usage Chart -->
        <div class="dash-card card-water">
          <div class="dash-card-title" data-i18n="dashboard_water_usage">Water Usage</div>
          <div class="water-container">
            <canvas id="chartWater"></canvas>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const charts = {};
    let historicalData = []; // Cache dữ liệu lịch sử
    let irrigationUsageData = [];
    let irrigationUsageSignature = '';
    const MAX_DATA_POINTS = 24; // Keep only last 24 points
    const TEMP_AXIS_MIN = 0; // Fixed temperature chart range (edit as needed)
    const TEMP_AXIS_MAX = 40;
    const TEMP_AXIS_STEP = 5;

    function t(key) {
      return window.SAIWS_PREFS && typeof window.SAIWS_PREFS.t === 'function'
        ? window.SAIWS_PREFS.t(key)
        : key;
    }

    function getChartTickColor() {
      const value = getComputedStyle(document.documentElement).getPropertyValue('--chart-tick-color').trim();
      return value || '#888';
    }

    function getChartGridColor() {
      const value = getComputedStyle(document.documentElement).getPropertyValue('--chart-grid-color').trim();
      return value || '#eee';
    }

    // Format time
    function formatTime(date) {
      return date.getHours().toString().padStart(2, '0') + ':' +
        date.getMinutes().toString().padStart(2, '0');
    }

    function formatSessionLabel(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '--';
      const dd = date.getDate().toString().padStart(2, '0');
      const mm = (date.getMonth() + 1).toString().padStart(2, '0');
      return `${dd}-${mm} ${formatTime(date)}`;
    }

    function getWaterUsageSeries() {
      if (!Array.isArray(irrigationUsageData) || irrigationUsageData.length === 0) {
        return {
          labels: [t('chart_no_irrigation_data')],
          liters: [0]
        };
      }

      return {
        labels: irrigationUsageData.map((s) => formatSessionLabel(s.start_at)),
        liters: irrigationUsageData.map((s) => Number(s.water_liters) || 0)
      };
    }

    function buildIrrigationSignature(sessions) {
      if (!Array.isArray(sessions) || sessions.length === 0) return '0';
      const last = sessions[sessions.length - 1];
      return `${sessions.length}|${last.start_at || ''}|${last.end_at || ''}|${last.water_liters || 0}`;
    }

    async function refreshIrrigationUsageData() {
      try {
        const usageRes = await fetch('/api/irrigation/usage?limit=20');
        const usageData = await usageRes.json();
        if (!usageData.ok || !Array.isArray(usageData.sessions)) return;

        const nextSignature = buildIrrigationSignature(usageData.sessions);
        if (nextSignature === irrigationUsageSignature) return;

        irrigationUsageData = usageData.sessions;
        irrigationUsageSignature = nextSignature;

        if (charts.chartWater) {
          const usage = getWaterUsageSeries();
          charts.chartWater.data.labels = usage.labels;
          charts.chartWater.data.datasets[0].data = usage.liters;
          charts.chartWater.update('active');
        }
      } catch (error) {
      }
    }

    // Calculate statistics
    function calculateStats(data) {
      if (!data || data.length === 0) return { min: 0, max: 0, avg: 0, current: 0 };
      const sorted = [...data].sort((a, b) => a - b);
      const sum = data.reduce((a, b) => a + b, 0);
      return {
        min: Math.round(sorted[0] * 10) / 10,
        max: Math.round(sorted[sorted.length - 1] * 10) / 10,
        avg: Math.round((sum / data.length) * 10) / 10,
        current: Math.round(data[data.length - 1] * 10) / 10
      };
    }

    // Update stat values WITHOUT rebuilding charts - very fast
    function updateStatsUI(history) {
      const moistures = history.map(h => h.soil_moisture).filter(m => m !== null);
      const temps = history.map(h => h.temperature).filter(t => t !== null);
      const humidities = history.map(h => h.humidity).filter(h => h !== null);

      if (moistures.length > 0) {
        const moistureStats = calculateStats(moistures);
        document.getElementById('moistureCurrent').textContent = moistureStats.current + '%';
        document.getElementById('moistureAvg').textContent = moistureStats.avg + '%';
        document.getElementById('moistureMax').textContent = moistureStats.max + '%';
        document.getElementById('moistureMin').textContent = moistureStats.min + '%';
      }

      if (temps.length > 0) {
        const tempStats = calculateStats(temps);
        document.getElementById('tempCurrent').textContent = tempStats.current + '°C';
        document.getElementById('tempAvg').textContent = tempStats.avg + '°C';
        document.getElementById('tempMax').textContent = tempStats.max + '°C';
        document.getElementById('tempMin').textContent = tempStats.min + '°C';
      }

      if (humidities.length > 0) {
        const humidityStats = calculateStats(humidities);
        document.getElementById('humidityCurrent').textContent = humidityStats.current + '%';
        document.getElementById('humidityAvg').textContent = humidityStats.avg + '%';
        document.getElementById('humidityMax').textContent = humidityStats.max + '%';
        document.getElementById('humidityMin').textContent = humidityStats.min + '%';
      }
    }

    // Update chart data dynamically WITH smooth animations
    function updateChartsData() {

      const moistures = historicalData.map(h => h.soil_moisture).filter(m => m !== null);
      const temps = historicalData.map(h => h.temperature).filter(t => t !== null);
      const humidities = historicalData.map(h => h.humidity).filter(h => h !== null);

      const timeLabels = historicalData.map(h => {
        const date = new Date(h.recorded_at);
        return formatTime(date);
      });

      // Update Moisture chart data with smooth animation
      if (charts.chartMoisture) {
        charts.chartMoisture.data.labels = timeLabels;
        charts.chartMoisture.data.datasets[0].data = moistures;
        charts.chartMoisture.update('active'); // Smooth animation (300ms default)
      }

      // Update Temperature chart data with smooth animation
      if (charts.chartTemp) {
        charts.chartTemp.data.labels = timeLabels;
        charts.chartTemp.data.datasets[0].data = temps;
        charts.chartTemp.update('active');
      }

      // Update Humidity chart data with smooth animation
      if (charts.chartHumidity && humidities.length > 0) {
        charts.chartHumidity.data.labels = timeLabels;
        charts.chartHumidity.data.datasets[0].data = humidities;
        charts.chartHumidity.update('active');
      }

      // Update Water Usage chart with smooth animation
      if (charts.chartWater) {
        const usage = getWaterUsageSeries();

        charts.chartWater.data.labels = usage.labels;
        charts.chartWater.data.datasets[0].data = usage.liters;
        charts.chartWater.update('active');
      }
    }

    // Build all charts once (only called on initial load)
    function buildCharts() {

      const moistures = historicalData.map(h => h.soil_moisture).filter(m => m !== null);
      const temps = historicalData.map(h => h.temperature).filter(t => t !== null);
      const humidities = historicalData.map(h => h.humidity).filter(h => h !== null);

      const timeLabels = historicalData.map(h => {
        const date = new Date(h.recorded_at);
        return formatTime(date);
      });

      // Build Moisture chart
      if (!charts.chartMoisture) {
        charts.chartMoisture = new Chart(document.getElementById('chartMoisture'), {
          type: 'line',
          data: {
            labels: timeLabels,
            datasets: [{
              label: t('chart_label_soil'),
              data: moistures,
              borderColor: '#3a9e3b',
              backgroundColor: 'rgba(58, 158, 59, 0.08)',
              borderWidth: 2,
              pointRadius: 3,
              pointBackgroundColor: '#3a9e3b',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 400,
              easing: 'easeInOutQuart'
            },
            plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
            scales: {
              y: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 11 }, color: getChartTickColor() }, grid: { color: getChartGridColor() } },
              x: { grid: { display: false }, ticks: { font: { size: 11 }, color: getChartTickColor() } }
            }
          }
        });
      }

      // Build Temperature chart
      if (!charts.chartTemp) {
        charts.chartTemp = new Chart(document.getElementById('chartTemp'), {
          type: 'line',
          data: {
            labels: timeLabels,
            datasets: [{
              label: t('chart_label_temperature'),
              data: temps,
              borderColor: '#e05555',
              backgroundColor: 'rgba(224, 85, 85, 0.08)',
              borderWidth: 2,
              pointRadius: 3,
              pointBackgroundColor: '#e05555',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 400,
              easing: 'easeInOutQuart'
            },
            plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
            scales: {
              y: {
                min: TEMP_AXIS_MIN,
                max: TEMP_AXIS_MAX,
                ticks: { stepSize: TEMP_AXIS_STEP, font: { size: 11 }, color: getChartTickColor() },
                grid: { color: getChartGridColor() }
              },
              x: { grid: { display: false }, ticks: { font: { size: 11 }, color: getChartTickColor() } }
            }
          }
        });
      }

      // Build Humidity chart
      if (humidities.length > 0 && !charts.chartHumidity) {
        charts.chartHumidity = new Chart(document.getElementById('chartHumidity'), {
          type: 'line',
          data: {
            labels: timeLabels,
            datasets: [{
              label: t('chart_label_humidity'),
              data: humidities,
              borderColor: '#7c6fc4',
              backgroundColor: 'rgba(124, 111, 196, 0.08)',
              borderWidth: 2,
              pointRadius: 3,
              pointBackgroundColor: '#7c6fc4',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 400,
              easing: 'easeInOutQuart'
            },
            plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
            scales: {
              y: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 11 }, color: getChartTickColor() }, grid: { color: getChartGridColor() } },
              x: { grid: { display: false }, ticks: { font: { size: 11 }, color: getChartTickColor() } }
            }
          }
        });
      }

      // Build Water Usage chart (per irrigation session)
      const usage = getWaterUsageSeries();

      if (!charts.chartWater) {
        charts.chartWater = new Chart(document.getElementById('chartWater'), {
          type: 'bar',
          data: {
            labels: usage.labels,
            datasets: [{
              label: t('chart_label_water'),
              data: usage.liters,
              backgroundColor: '#8b83d4',
              borderRadius: 6,
              borderSkipped: false,
              barPercentage: 0.65
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 500,
              easing: 'easeInOutQuart'
            },
            plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 11 } } } },
            scales: {
              y: {
                beginAtZero: true,
                max: 20,
                ticks: { font: { size: 11 }, color: getChartTickColor() },
                grid: { color: getChartGridColor() }
              },
              x: { grid: { display: false }, ticks: { font: { size: 11 }, color: getChartTickColor() } }
            }
          }
        });
      }
    }

    // Load initial data
    async function loadInitialData() {
      try {
        const historyRes = await fetch('/api/sensor/history?limit=24');
        const historyData = await historyRes.json();

        if (historyData.ok && historyData.history) {
          historicalData = historyData.history;
          updateStatsUI(historicalData);
        }

        await refreshIrrigationUsageData();

        if (!charts.chartMoisture) {
          buildCharts();
        } else {
          updateChartsData();
        }
      } catch (error) {
      }
    }

    // Connect to real-time stream
    function connectStream() {
      const eventSource = new EventSource('/api/sensor/stream');

      eventSource.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);

          if (message.type === 'batch' && message.records) {
            // Append new records to historical data
            historicalData.push(...message.records);

            // Keep only last MAX_DATA_POINTS records
            if (historicalData.length > MAX_DATA_POINTS) {
              historicalData = historicalData.slice(historicalData.length - MAX_DATA_POINTS);
            }

            // Update ONLY stats values (instant, no animation)
            updateStatsUI(historicalData);

            // Update charts data dynamically (no rebuild, no animation)
            updateChartsData();

          } else if (message.type === 'connected') {
          }
        } catch (err) {
        }
      };

      eventSource.onerror = (error) => {
        eventSource.close();
        setTimeout(connectStream, 5000);
      };
    }

    // Load data when page loads
    document.addEventListener('DOMContentLoaded', () => {

      // Initial load
      loadInitialData();

      // Connect to real-time stream
      connectStream();

      // Refresh irrigation usage frequently so chart updates right after a session ends.
      setInterval(() => {
        refreshIrrigationUsageData();
      }, 10000);

      // Full refresh every 5 minutes as safety net
      setInterval(() => {
        loadInitialData();
      }, 300000);
    });
  </script>
</body>

</html>
