<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIWS – History</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/preferences.js"></script>
  <style>
    .history-section {
      margin-bottom: 28px;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0 0 14px 0;
    }

    .history-card {
      background: var(--surface);
      border-radius: 18px;
      border: 2px solid var(--card-border);
      padding: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
    }

    .history-table thead tr {
      background: var(--table-header-bg);
    }

    .history-table thead th {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--text-dark);
      padding: 16px 28px;
      text-align: left;
    }

    .history-table tbody tr {
      border-top: 1px solid var(--line);
      transition: background 0.15s;
    }

    .history-table tbody tr:hover {
      background: var(--table-row-hover);
    }

    .history-table tbody td {
      padding: 18px 28px;
      color: var(--text-mid);
      font-weight: 400;
    }

    .history-loading,
    .history-empty,
    .history-error {
      text-align: center;
      color: var(--text-mid);
    }

    .history-error {
      color: #b42318;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <span class="navbar-brand">SAIWS</span>
    <div class="navbar-icons">
      <div class="profile-wrap">
        <button id="profileBtn" title="Profile" data-i18n-title="user_menu_title">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
          </svg>
        </button>
        <div id="profileDropdown" class="profile-dropdown">
          <a href="profile.html">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
            </svg>
            <span data-i18n="nav_view_profile">View Profile</span>
          </a>
          <div class="divider"></div>
          <a href="/views/login.html" data-logout>
            <svg viewBox="0 0 24 24">
              <path
                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
            </svg>
            <span data-i18n="nav_logout">Log out</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <a href="../index.html" data-i18n="nav_home">Home</a>
      <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="history.html" class="active" data-i18n="nav_history">History</a>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1 class="page-title" data-i18n="history_title">History</h1>
      </div>

      <div class="history-section">
        <h2 class="section-title" data-i18n="history_irrigation">Irrigation History</h2>
        <div class="history-card">
          <table class="history-table">
            <thead>
              <tr>
                <th data-i18n="col_date">Date</th>
                <th data-i18n="col_start">Start</th>
                <th data-i18n="col_end">End</th>
                <th data-i18n="col_device_id">Device ID</th>
              </tr>
            </thead>
            <tbody id="irrigationBody">
              <tr>
                <td colspan="4" class="history-loading" data-i18n="history_loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="history-section">
        <h2 class="section-title" data-i18n="history_alert">Alert History</h2>
        <div class="history-card">
          <table class="history-table">
            <thead>
              <tr>
                <th data-i18n="col_date">Date</th>
                <th data-i18n="col_time">Time</th>
                <th data-i18n="col_content">Content</th>
                <th data-i18n="col_device_id">Device ID</th>
              </tr>
            </thead>
            <tbody id="alertBody">
              <tr>
                <td colspan="4" class="history-loading" data-i18n="history_loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
  <script>
    (function () {
      const REFRESH_INTERVAL_MS = 3000;
      let isRefreshing = false;
      let refreshTimer = null;

      function t(key) {
        return window.SAIWS_PREFS && typeof window.SAIWS_PREFS.t === 'function'
          ? window.SAIWS_PREFS.t(key)
          : key;
      }

      const locale = window.SAIWS_PREFS && window.SAIWS_PREFS.getLanguage() === 'vi' ? 'vi-VN' : 'en-GB';

      const dateFmt = new Intl.DateTimeFormat(locale, { day: 'numeric', month: 'short', year: 'numeric' });
      const timeFmt = new Intl.DateTimeFormat(locale, { hour: '2-digit', minute: '2-digit', hour12: false });

      function formatDate(d) {
        if (!d) return '—';
        const x = d instanceof Date ? d : new Date(d);
        return Number.isNaN(x.getTime()) ? '—' : dateFmt.format(x);
      }

      function formatTime(d) {
        if (!d) return '—';
        const x = d instanceof Date ? d : new Date(d);
        return Number.isNaN(x.getTime()) ? '—' : timeFmt.format(x);
      }

      async function loadIrrigation() {
        const tbody = document.getElementById('irrigationBody');
        try {
          const res = await fetch('/api/history/irrigation', { cache: 'no-store' });
          const data = await res.json();
          if (!data.ok) throw new Error(data.detail || data.error || 'Request failed');
          const rows = data.rows || [];
          if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="history-empty">' + t('history_no_irrigation') + '</td></tr>';
            return;
          }
          tbody.innerHTML = rows.map(function (r) {
            const start = r.start_at;
            const end = r.end_at;
            return '<tr><td>' + formatDate(start) + '</td><td>' + formatTime(start) + '</td><td>' +
              formatTime(end) + '</td><td>' + (r.device_id != null ? r.device_id : '—') + '</td></tr>';
          }).join('');
        } catch (e) {
          tbody.innerHTML = '<tr><td colspan="4" class="history-error">' + t('history_load_error') + '</td></tr>';
          console.error(e);
        }
      }

      async function loadAlerts() {
        const tbody = document.getElementById('alertBody');
        try {
          const res = await fetch('/api/history/alerts', { cache: 'no-store' });
          const data = await res.json();
          if (!data.ok) throw new Error(data.detail || data.error || 'Request failed');
          const rows = data.rows || [];
          if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="history-empty">' + t('history_no_alert') + '</td></tr>';
            return;
          }
          tbody.innerHTML = rows.map(function (r) {
            const t = r.created_at;
            const content = (r.content || '').replace(/</g, '&lt;');
            return '<tr><td>' + formatDate(t) + '</td><td>' + formatTime(t) + '</td><td>' + content +
              '</td><td>' + (r.device_id != null ? r.device_id : '—') + '</td></tr>';
          }).join('');
        } catch (e) {
          tbody.innerHTML = '<tr><td colspan="4" class="history-error">' + t('history_load_error') + '</td></tr>';
          console.error(e);
        }
      }

      async function refreshTables() {
        if (isRefreshing) return;
        isRefreshing = true;
        try {
          await Promise.all([loadIrrigation(), loadAlerts()]);
        } finally {
          isRefreshing = false;
        }
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          refreshTables();
        }
      });

      window.addEventListener('beforeunload', function () {
        if (refreshTimer) clearInterval(refreshTimer);
      });

      refreshTables();
      refreshTimer = setInterval(refreshTables, REFRESH_INTERVAL_MS);
    })();
  </script>
</body>

</html>
